# ---------------------------------------------------------------------------
# Publishing happens from the CMS itself, which commits the generated files
# (events/<slug>.html, js/events-data.js, sitemap.xml and any images) through
# the GitHub Contents API in a single commit per publish.
#
# This workflow is the safety net: it verifies that the generated files are
# internally consistent, so a bad publish shows up in CI rather than only on
# the live site.
# ---------------------------------------------------------------------------

name: Verify CMS-generated content

on:
  push:
    branches: [main]
    paths:
      - 'js/events-data.js'
      - 'events/**'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  verify-generated-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static site
        uses: actions/checkout@v4

      - name: Check every listed event has a detail page
        run: |
          node -e "
            const fs = require('fs');
            const source = fs.readFileSync('js/events-data.js', 'utf8');
            const sandbox = { window: {} };
            new Function('window', source)(sandbox.window);
            const events = sandbox.window.EVENTS || [];

            if (!Array.isArray(events)) {
              console.error('events-data.js did not produce an EVENTS array.');
              process.exit(1);
            }

            const problems = [];
            for (const event of events) {
              if (!event.slug) problems.push('An entry has no slug.');
              if (!event.title) problems.push(event.slug + ': missing title.');
              if (!/^\d{4}-\d{2}-\d{2}$/.test(event.date || '')) {
                problems.push(event.slug + ': date must be YYYY-MM-DD.');
              }
              const page = 'events/' + event.slug + '.html';
              if (!fs.existsSync(page)) problems.push(event.slug + ': missing ' + page);
            }

            if (problems.length) {
              console.error('Generated content is inconsistent:');
              problems.forEach(p => console.error('  - ' + p));
              process.exit(1);
            }
            console.log('Checked ' + events.length + ' events. Every one has a detail page.');
          "

      - name: Check for orphaned detail pages
        run: |
          node -e "
            const fs = require('fs');
            const source = fs.readFileSync('js/events-data.js', 'utf8');
            const sandbox = { window: {} };
            new Function('window', source)(sandbox.window);
            const slugs = new Set((sandbox.window.EVENTS || []).map(e => e.slug + '.html'));

            const pages = fs.readdirSync('events')
              .filter(name => name.endsWith('.html') && name !== '_template.html');
            const orphans = pages.filter(name => !slugs.has(name));

            if (orphans.length) {
              console.error('These detail pages are still live but are not listed anywhere:');
              orphans.forEach(name => console.error('  - events/' + name));
              console.error('Republish or delete them from the CMS.');
              process.exit(1);
            }
            console.log('No orphaned detail pages.');
          "
